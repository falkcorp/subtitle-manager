# file: .github/workflows/ci.yml
# version: 2.0.1
# guid: f1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6

name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Use the reusable CI workflow
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/reusable-ci.yml
    with:
      go-version: '1.25'
      node-version: '22'
      python-version: '3.13'
      rust-version: '1.76'
      # Coverage is reported but not gated: the repo is at ~26% and
      # repository-config.yml sets fail_below_threshold: false. Raising real
      # coverage is tracked separately; 0 keeps the standard 80% default from
      # failing every Go CI run.
      coverage-threshold: '0'
      skip-protobuf: false
      skip-tests: false
      skip-e2e-tests: true
      skip-linting: false
    secrets: inherit

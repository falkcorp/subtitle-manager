# file: .github/workflows/ci.yml
# version: 2.1.2
# guid: f1a2b3c4-d5e6-f7a8-b9c0-d1e2f3a4b5c6

name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write
  packages: write
  security-events: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Use the reusable CI workflow
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/reusable-ci.yml
    with:
      go-version: '1.26'
      node-version: '22'
      python-version: '3.13'
      rust-version: '1.76'
      # Coverage is reported but not gated: the repo is at ~26% and
      # repository-config.yml sets fail_below_threshold: false. Raising real
      # coverage is tracked separately; 0 keeps the standard 80% default from
      # failing every Go CI run.
      coverage-threshold: '0'
      skip-protobuf: false
      skip-tests: false
      skip-e2e-tests: true
      skip-linting: false
    secrets: inherit

  # Compile every platform goreleaser ships.
  #
  # The reusable CI above builds only the runner's own platform, so a
  # Unix-only syscall compiled fine on Linux and broke the release build
  # instead — releases failed for days while every PR stayed green. This is a
  # compile check, not a test run: cross-compiled binaries cannot be executed
  # here, and catching the build break is the whole point.
  cross-build:
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      # SHA-pinned to match every other workflow here; this repo's policy
      # rejects tag refs, which fails the job at set-up time rather than at the
      # build step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

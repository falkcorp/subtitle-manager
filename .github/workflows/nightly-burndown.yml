# file: .github/workflows/nightly-burndown.yml
# version: 1.0.0
name: Nightly burndown

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | draft-only | full"
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - draft-only
          - full

jobs:
  burndown:
    uses: falkcorp/github-common/.github/workflows/reusable-burndown.yml@d0c3326b96557c8ea9117c1c196b628e5e028186
    with:
      mode: ${{ inputs.mode || 'dry-run' }}
    secrets: inherit

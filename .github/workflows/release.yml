# file: .github/workflows/release.yml
# version: 2.1.0
# guid: 8b4d6c2a-1f5e-4a8b-9c3d-7e2f5a8b1c4d
# last-edited: 2026-07-25

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
      build-target:
        description: 'Build target'
        required: false
        type: choice
        options:
          - all
          - go
          - rust
          - python
          - frontend
          - docker
          - protobuf
        default: all
      prerelease:
        description: 'Create prerelease'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      stable:
        description: 'Publish a stable (non-RC) release directly'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    uses: ./.github/workflows/reusable-release.yml
    with:
      release-type: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release-type || 'auto' }}
      build-target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build-target || 'all' }}
      draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
      prerelease: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.prerelease == 'true' }}
      stable: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stable == 'true' || false }}
      # This repository commits its generated .pb.go files (25 of them, under
      # pkg/), and `go build ./...` succeeds from a clean checkout. Regenerating
      # protobuf at release time is therefore redundant, and it broke releases
      # two ways: the generator needs Go >= 1.25 while the action runs 1.23, and
      # its output directory left the tree dirty so goreleaser refused to build.
      protobuf-disabled: true
    secrets: inherit

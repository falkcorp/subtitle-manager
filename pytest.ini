# Root pytest configuration for the Go-primary subtitle-manager repo.
#
# subtitle-manager is a Go application; its Python lives in three independent
# contexts, each with its own dependencies that are NOT in the root
# requirements.txt, so none belong in the standard-CI unit run:
#   - tests/e2e/            Selenium browser E2E (selenium + webdriver + a live
#                           server); run out-of-band, see tests/e2e/README.md
#   - sdks/python/          the published subtitle_manager_sdk, tested in its own
#                           package context (`cd sdks/python && pip install .[dev]`)
#   - scripts/              one-off tooling with per-tool local packages
#
# So scope root collection to tests/ (excluding e2e) where a single smoke test
# keeps the standard-CI pytest run green without dragging in those extra deps.
[pytest]
testpaths = tests
addopts = --ignore=tests/e2e

# Root pytest configuration for the Go-primary subtitle-manager repo.
#
# The only Python tests in this tree are the Selenium browser E2E suite under
# tests/e2e/, which needs selenium + webdriver_manager + a live server/browser
# and is run out-of-band (see tests/e2e/README.md), not in unit CI. Ignore it so
# standard CI's pytest collection doesn't fail on the selenium import.
[pytest]
addopts = --ignore=tests/e2e

# Root pytest configuration for the Go-primary subtitle-manager repo.
#
# subtitle-manager is a Go application. The Python that remains is:
#   - sdks/python/          the published subtitle_manager_sdk, tested in its
#                           own package context with its own requirements.txt
#                           (`cd sdks/python && pip install .[dev]`)
#   - scripts/              one-off repo tooling, stdlib or per-tool local deps
#   - tests/                this context: a single smoke test
#
# Neither of the first two belongs in the standard-CI unit run, so root
# collection is scoped to tests/.
#
# There is deliberately no root requirements.txt. It used to carry ~110
# packages inherited from Bazarr (Flask, SQLAlchemy, alembic, subliminal,
# guessit, …) that nothing in this repo imported, while omitting the one
# dependency anything actually needed. The only Python the CI runs is stdlib.
[pytest]
testpaths = tests
